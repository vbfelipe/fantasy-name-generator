<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Name Generator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Fantasy Name Generator</h1>
        <h2>Generate unique fantasy names for your characters!<br>The pool currently contains over 1000 random syllables.</h2>
        <h3>Choose your style:</h3>
        <div class="realm-selector">
        <button class="realm-btn active realm-human" data-realm="human">Human Realm</button>
        <button class="realm-btn realm-elf" data-realm="elf">Elven Realm</button>
        <button class="realm-btn realm-dark" data-realm="dark">Dark Realm</button>
        <button class="realm-btn realm-random" data-realm="random">Random</button>        
        </div>
        <p id="realm-description" class="realm-description">Timeless names from the lands of men</p>
        <button id="generateBtn">Generate</button>
        <p id="name">Try it!</p>
    </div>
    <footer class="footer">
    <p>v0.1<br>© 2025 — Felipe Vicentini</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
